<!-- お札の掛け軸（妖怪シリーズ・画像タイプの壁アイテム）。360x1000で描く -->
<canvas id=c width=360 height=1000></canvas><script>
const c=document.getElementById('c'),g=c.getContext('2d');const W=360,H=1000;
g.fillStyle='#efe6da';g.fillRect(0,0,W,H);
// 吊り紐
g.strokeStyle='#6d4c41';g.lineWidth=4;g.beginPath();g.moveTo(110,60);g.lineTo(180,8);g.lineTo(250,60);g.stroke();
// 上の軸
g.fillStyle='#2b1d16';g.fillRect(70,56,220,22);g.fillStyle='#4a3326';g.fillRect(70,56,220,6);
// 表装（外側の布：深緑の金襴っぽい色、内側：生成り）
g.fillStyle='#3c4a3a';g.fillRect(84,78,192,850);
for(let y=78;y<928;y+=14){g.fillStyle='rgba(212,175,55,.18)';g.fillRect(84,y,192,2)}
g.fillStyle='#f3ecdc';g.fillRect(104,150,152,700);
// お札（黄色）
g.fillStyle='#f7d51d';g.fillRect(124,190,112,620);g.fillStyle='rgba(0,0,0,.06)';g.fillRect(124,190,112,4);
const red='#d6281e';g.fillStyle=red;g.strokeStyle=red;g.textAlign='center';g.textBaseline='middle';
const F='"Noto Serif CJK JP","Noto Serif JP","Hiragino Mincho ProN",serif';
g.font='900 70px '+F;g.save();g.translate(180,262);g.scale(1,1.08);g.fillText('勅',0,0);g.restore();
g.font='900 56px '+F;g.fillText('令',180,340);
// 渦巻き（ぐるぐる）
g.lineWidth=4.5;for(let k=0;k<3;k++){const y=392+k*30;g.beginPath();for(let t=0;t<=Math.PI*2;t+=.05){const x=180+Math.sin(t)*44,yy=y+Math.sin(2*t)*11;t===0?g.moveTo(x,yy):g.lineTo(x,yy)}g.stroke()}
// 下に広がる枠線
g.lineWidth=3.5;g.beginPath();g.moveTo(140,488);g.quadraticCurveTo(150,640,128,790);g.moveTo(220,488);g.quadraticCurveTo(210,640,232,790);g.moveTo(132,484);g.lineTo(228,484);g.stroke();
g.font='700 40px '+F;['随','身','保','命'].forEach((ch,i)=>g.fillText(ch,180,530+i*62));
// 下の軸
g.fillStyle='#2b1d16';g.fillRect(64,928,232,26);g.fillStyle='#4a3326';g.fillRect(64,928,232,6);
g.fillStyle='#1a120d';g.fillRect(52,930,14,22);g.fillRect(294,930,14,22);
</script>
